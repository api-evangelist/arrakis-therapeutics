name: Arrakis Therapeutics
description: Arrakis Therapeutics is a clinical-stage biopharmaceutical company pioneering
  RNA-targeted small molecules (rSMs) — orally available small-molecule medicines designed to
  bind directly to RNA and reach targets long considered undruggable. Its rSM Platform and rSM
  Toolkit industrialize the discovery and development of these medicines across proprietary and
  partnered programs, with a lead candidate addressing the root cause of Type 1 Myotonic
  Dystrophy (DM1). Based in Waltham, Massachusetts, the company is backed by Canaan Partners.
  This profile is part of the API Evangelist network; Arrakis Therapeutics does not currently
  publish a public developer API, SDK, or documentation surface.
